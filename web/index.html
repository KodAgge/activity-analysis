<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- `viewport-fit=cover` is what makes `env(safe-area-inset-*)` resolve to
         anything but 0. The tab bar in `components/TabBar.module.css` and the
         scroll inset in `components/AppShell.module.css` both budget for the
         home indicator through `--tabbar-inset`; without this attribute that
         budget is silently zero on the hardware that needs it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>activity-analysis</title>
  </head>
